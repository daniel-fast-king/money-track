<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Money Tracker</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#172033;--mut:#5d687c;--line:#d6dce5;--real:#0e7c66;--fake:#b3367a;--gain:#b27a0c;--out:#b8412f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--ink:#eef1f6;--mut:#9aa6ba;--line:#2c3649;--real:#37c4a3;--fake:#e873b5;--gain:#e5b13f;--out:#ee8672}}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){main{grid-template-columns:400px minmax(0,1fr);padding:40px 28px;align-items:start}.side{position:sticky;top:24px}.hist h2{margin-top:0}.hero .big{font-size:3.4rem}}
@media (max-width:360px){.hero .big{font-size:2.2rem}.stats{gap:8px}}
@media (prefers-reduced-motion:no-preference){li{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(-4px)}}}
h1{font-size:1.5rem;font-weight:800;margin:0 0 16px}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px}
.hero small{opacity:.75;font-size:.9rem}
.hero .big{font-size:2.8rem;font-weight:800;line-height:1.1;margin:2px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem}
.stat span{color:var(--mut);font-size:.85rem}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px;display:grid;gap:10px}
label{font-size:.85rem;color:var(--mut);display:grid;gap:4px}
input,select,button{font:inherit;font-size:1rem;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
button{min-height:46px;background:var(--real);color:#fff;border:0;font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--fake);outline-offset:2px}
h2{font-size:1.1rem;margin:24px 0 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
li .t{flex:1;min-width:0}li .t small{display:block;color:var(--mut)}
li .a{font-weight:700;color:var(--c)}
li .x{width:auto;background:none;color:var(--mut);padding:6px 10px;border:1px solid var(--line)}
.empty{color:var(--mut);padding:12px 0}
</style>
</head>
<body>
<main>
<div class="side">
<h1>Game money tracker</h1>
<section class="hero"><small>Real money balance</small><div class="big" id="bal">0</div></section>
<section class="stats">
<div class="stat"><b id="fam">0</b><span>From family</span></div>
<div class="stat"><b id="oth">0</b><span>Other gained</span></div>
<div class="stat"><b id="rp">0</b><span>Real purchases</span></div>
<div class="stat"><b id="fp" style="color:var(--fake)">0</b><span>Saved with fake money</span></div>
</section>

<form id="f">
<label>Type
<select id="type">
<option value="family">Money from family</option>
<option value="real">Real purchase</option>
<option value="fake">Fake-money purchase</option>
<option value="other">Other gained</option>
</select></label>
<label id="nl">Item name<input id="name" maxlength="60" placeholder="e.g. Sneakers"></label>
<label>Amount<input id="amt" type="number" min="0" step="any" inputmode="decimal" required placeholder="1000"></label>
<button type="submit">Add entry</button>
</form>
</div>
<div class="hist">
<h2>History</h2>
<ul id="list"></ul>
</div>
</main>
<script>
var KEY="gameMoneyTracker",L={family:["Family money","var(--real)",1],real:["Real purchase","var(--out)",-1],fake:["Fake-money purchase","var(--fake)",0],other:["Other gained","var(--gain)",1]};
var data=[];
try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){data=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function n(v){return Math.round(v*100)/100;}
function $(i){return document.getElementById(i)}
function sum(t){return data.filter(function(d){return d.type===t}).reduce(function(s,d){return s+d.amount},0)}
function render(){
 var f=sum("family"),o=sum("other"),r=sum("real"),k=sum("fake");
 $("bal").textContent=n(f+o-r).toLocaleString();
 $("fam").textContent=n(f).toLocaleString();$("oth").textContent=n(o).toLocaleString();
 $("rp").textContent=n(r).toLocaleString();$("fp").textContent=n(k).toLocaleString();
 var ul=$("list");ul.innerHTML="";
 if(!data.length){ul.innerHTML='<li class="empty" style="border:0;background:none">No entries yet. Add your first one above.</li>';return}
 data.slice().reverse().forEach(function(d){
  var li=document.createElement("li");li.style.setProperty("--c",L[d.type][1]);
  var sign=L[d.type][2]>0?"+":L[d.type][2]<0?"−":"";
  li.innerHTML='<div class="t">'+L[d.type][0]+'<small></small></div><div class="a">'+sign+n(d.amount).toLocaleString()+'</div><button class="x" aria-label="Delete entry">Delete</button>';
  li.querySelector("small").textContent=(d.name?d.name+" · ":"")+new Date(d.id).toLocaleDateString();
  li.querySelector(".x").onclick=function(){data=data.filter(function(x){return x.id!==d.id});save();render()};
  ul.appendChild(li);
 });
}
function toggle(){var t=$("type").value;$("nl").firstChild.textContent=t==="other"?"Source (optional)":"Item name (optional)";$("nl").style.display=t==="family"?"none":"grid"}
$("type").onchange=toggle;toggle();
$("f").onsubmit=function(e){e.preventDefault();
 var a=parseFloat($("amt").value);if(!(a>=0))return;
 data.push({id:Date.now(),type:$("type").value,name:$("name").value.trim(),amount:a});
 save();$("amt").value="";$("name").value="";render();$("amt").focus();
};
render();
</script>
</body>
</html>
